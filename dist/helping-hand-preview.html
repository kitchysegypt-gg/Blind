<title>Helping Hand</title>
<style>
:root {
  --scale: 1;
  --bg: #0b0b0f;
  --surface: #1a1c24;
  --surface-2: #262935;
  --text: #ffffff;
  --muted: #c9cedb;
  --focus: #ffd21f;
  --border: #3a3f50;
  --radius: 24px;
  color-scheme: dark;
  font-size: calc(20px * var(--scale));
}
:root[data-look="yellow"] {
  --bg: #000000;
  --surface: #111111;
  --surface-2: #1c1c1c;
  --text: #ffe600;
  --muted: #ffe600;
  --focus: #00e5ff;
  --border: #ffe600;
  color-scheme: dark;
}
:root[data-look="light"] {
  --bg: #f4f1ea;
  --surface: #ffffff;
  --surface-2: #ebe7de;
  --text: #111111;
  --muted: #333a46;
  --focus: #0047ff;
  --border: #9aa0ad;
  color-scheme: light;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", Arial, sans-serif;
  line-height: 1.35;
  min-height: 100vh;
  padding-bottom: env(safe-area-inset-bottom);
  -webkit-tap-highlight-color: transparent;
}
[hidden] { display: none !important; }

.skip {
  position: absolute; inset-inline-start: -9999px; top: 0;
  background: var(--focus); color: #000; padding: 12px 16px; z-index: 100;
}
.skip:focus { inset-inline-start: 8px; top: 8px; }

:focus-visible {
  outline: 5px solid var(--focus);
  outline-offset: 4px;
}

/* ---------- Top bar ---------- */
.topbar {
  position: sticky; top: 0; z-index: 10;
  display: flex; align-items: center; gap: 12px;
  padding: calc(10px + env(safe-area-inset-top)) 16px 10px;
  background: var(--bg);
  border-bottom: 2px solid var(--border);
}
.topbar h1 {
  flex: 1; margin: 0; font-size: 1.5rem; font-weight: 800; letter-spacing: .2px;
}
.iconbtn {
  width: 64px; height: 64px; flex: none;
  border-radius: 20px; border: 2px solid var(--border);
  background: var(--surface); color: var(--text);
  display: grid; place-items: center; cursor: pointer;
  box-shadow: 0 5px 0 rgba(0,0,0,.45);
}
.iconbtn:active { transform: translateY(4px); box-shadow: 0 1px 0 rgba(0,0,0,.45); }
.iconbtn .ico { width: 44px; height: 44px; }

main { max-width: 760px; margin: 0 auto; padding: 16px; }
.screen { display: flex; flex-direction: column; gap: 18px; }

.greeting { margin: 4px 0 0; font-size: 1.35rem; font-weight: 700; color: var(--muted); }
.lead { font-size: 1.3rem; font-weight: 700; margin: 0; }
.hint { color: var(--muted); margin: 0; font-size: .95rem; }

/* ---------- 3D icons ---------- */
.ico { display: inline-block; width: 56px; height: 56px; flex: none; }
.ico svg { width: 100%; height: 100%; display: block; overflow: visible;
  filter: drop-shadow(0 6px 4px rgba(0,0,0,.35)); }
.ico-lg { width: 84px; height: 84px; }
.ico-xl { width: 112px; height: 112px; }

/* ---------- Big mic ---------- */
.mic-hero {
  display: flex; align-items: center; gap: 18px;
  width: 100%; padding: 18px 20px; min-height: 140px;
  border-radius: 32px; border: 3px solid rgba(255,255,255,.18);
  background: linear-gradient(160deg, #7b3cff 0%, #4a1fb8 100%);
  color: #fff; font: inherit; font-size: 1.4rem; font-weight: 800; text-align: start;
  box-shadow: 0 10px 0 #2b0f73, 0 16px 26px rgba(0,0,0,.45), inset 0 2px 0 rgba(255,255,255,.35);
  cursor: pointer;
}
.mic-hero:active { transform: translateY(8px); box-shadow: 0 2px 0 #2b0f73, 0 4px 10px rgba(0,0,0,.4), inset 0 2px 0 rgba(255,255,255,.35); }
.mic-hero-text { flex: 1; }

/* ---------- Tiles ---------- */
.grid {
  display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px;
  padding-bottom: 8px;
}
.tile {
  --c1: #333; --c2: #222; --edge: #111;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
  min-height: 170px; padding: 16px 8px;
  border-radius: var(--radius);
  border: 3px solid rgba(255,255,255,.2);
  background: linear-gradient(165deg, var(--c1), var(--c2));
  color: #fff; font: inherit; font-weight: 800; font-size: 1.25rem;
  text-shadow: 0 2px 2px rgba(0,0,0,.45);
  box-shadow: 0 10px 0 var(--edge), 0 16px 24px rgba(0,0,0,.4), inset 0 2px 0 rgba(255,255,255,.35);
  cursor: pointer; transition: transform .08s, box-shadow .08s;
}
.tile:active { transform: translateY(8px); box-shadow: 0 2px 0 var(--edge), 0 4px 10px rgba(0,0,0,.4), inset 0 2px 0 rgba(255,255,255,.35); }
.tile .ico { transition: transform .15s; }
.tile:hover .ico, .tile:focus-visible .ico { transform: translateY(-4px) rotate(-4deg) scale(1.05); }
.tile-label { text-align: center; overflow-wrap: anywhere; }
.tile-orange { --c1: #ff9a2e; --c2: #d4600a; --edge: #8a3a00; }
.tile-red    { --c1: #f24b4b; --c2: #b81c1c; --edge: #6e0b0b; }
.tile-blue   { --c1: #3b8ff7; --c2: #1a55c4; --edge: #0d2f75; }
.tile-pink   { --c1: #ff5f9a; --c2: #c41f64; --edge: #730a37; }
.tile-green  { --c1: #2fc451; --c2: #178a33; --edge: #0b4d1b; }
.tile-purple { --c1: #8d57ff; --c2: #5728c9; --edge: #2f1178; }

:root[data-look="yellow"] .tile,
:root[data-look="yellow"] .mic-hero {
  background: #000; color: #ffe600; border-color: #ffe600; text-shadow: none;
  box-shadow: 0 8px 0 #ffe600;
}

/* ---------- SOS ---------- */
.sos {
  display: flex; align-items: center; justify-content: center; gap: 16px;
  width: 100%; min-height: 130px; margin-top: 6px; margin-bottom: 18px;
  border-radius: 32px; border: 4px solid #fff;
  background: repeating-linear-gradient(135deg, #e01212 0 26px, #c40c0c 26px 52px);
  color: #fff; font: inherit; font-size: 1.6rem; font-weight: 900; letter-spacing: 1px;
  padding: 12px 16px; overflow-wrap: anywhere;
  box-shadow: 0 10px 0 #5f0000, 0 16px 26px rgba(0,0,0,.5), inset 0 2px 0 rgba(255,255,255,.4);
  cursor: pointer;
}
.sos .ico { width: 72px; height: 72px; }
.sos:active { transform: translateY(8px); box-shadow: 0 2px 0 #5f0000; }

/* ---------- Big buttons ---------- */
.bigbtn {
  --c1: #444; --c2: #333; --edge: #111;
  display: flex; align-items: center; justify-content: center; gap: 14px;
  width: 100%; min-height: 92px; padding: 14px 20px;
  border-radius: 26px; border: 3px solid rgba(255,255,255,.2);
  background: linear-gradient(165deg, var(--c1), var(--c2));
  color: #fff; font: inherit; font-size: 1.35rem; font-weight: 800;
  text-shadow: 0 2px 2px rgba(0,0,0,.4);
  box-shadow: 0 8px 0 var(--edge), 0 12px 20px rgba(0,0,0,.35), inset 0 2px 0 rgba(255,255,255,.3);
  cursor: pointer; margin-bottom: 8px;
}
.bigbtn:active { transform: translateY(6px); box-shadow: 0 2px 0 var(--edge); }
.bigbtn .ico { width: 56px; height: 56px; }
.bigbtn-green  { --c1: #2fc451; --c2: #178a33; --edge: #0b4d1b; }
.bigbtn-red    { --c1: #f24b4b; --c2: #b81c1c; --edge: #6e0b0b; }
.bigbtn-orange { --c1: #ff9a2e; --c2: #d4600a; --edge: #8a3a00; }
.bigbtn-purple { --c1: #8d57ff; --c2: #5728c9; --edge: #2f1178; }
.bigbtn-blue   { --c1: #3b8ff7; --c2: #1a55c4; --edge: #0d2f75; }
.bigbtn-gray   { --c1: #5b6578; --c2: #3a4152; --edge: #1b1f29; }
:root[data-look="yellow"] .bigbtn { background: #000; color: #ffe600; border-color: #ffe600; text-shadow: none; box-shadow: 0 6px 0 #ffe600; }

/* ---------- Request ---------- */
.req-head { display: flex; align-items: center; gap: 16px; }
.field-label { display: block; font-weight: 700; margin: 6px 0 6px; }
.field {
  width: 100%; font: inherit; font-size: 1.15rem;
  padding: 16px; border-radius: 16px;
  border: 3px solid var(--border); background: var(--surface); color: var(--text);
}
textarea.field { resize: vertical; min-height: 110px; }
.chips { display: flex; flex-wrap: wrap; gap: 12px; }
.chip {
  font: inherit; font-weight: 700; font-size: 1.1rem;
  min-height: 64px; padding: 10px 20px; border-radius: 999px;
  border: 3px solid var(--border); background: var(--surface-2); color: var(--text);
  box-shadow: 0 5px 0 rgba(0,0,0,.45); cursor: pointer;
}
.chip[aria-pressed="true"] { background: var(--focus); color: #000; border-color: var(--focus); }
.chip:active { transform: translateY(4px); box-shadow: 0 1px 0 rgba(0,0,0,.45); }
.check { display: flex; align-items: center; gap: 14px; font-weight: 700; font-size: 1.15rem; min-height: 56px; cursor: pointer; }
.check input { width: 36px; height: 36px; accent-color: #2fc451; flex: none; }

/* ---------- Lists ---------- */
.stack { display: flex; flex-direction: column; gap: 16px; }
.card {
  background: var(--surface); border: 2px solid var(--border); border-radius: 20px;
  padding: 16px 18px;
}
.card h2 { margin: 0 0 6px; font-size: 1.2rem; }
.card p { margin: 0; color: var(--muted); }
.empty { color: var(--muted); font-size: 1.2rem; text-align: center; padding: 30px 10px; }

fieldset { border: 2px solid var(--border); border-radius: 20px; padding: 14px 16px 18px; margin: 0; }
legend { font-weight: 800; font-size: 1.25rem; padding: 0 8px; }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }

/* ---------- Emergency ---------- */
.countdown { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 8px 0 4px; }
.countdown-text { font-size: 1.6rem; font-weight: 900; text-align: center; margin: 0; }
.pulse { animation: pulse 1s ease-in-out infinite; }
@keyframes pulse { 50% { transform: scale(1.1); } }

/* ---------- Overlays (listening, preview sheet) ---------- */
.overlay {
  position: fixed; inset: 0; z-index: 50;
  background: rgba(10, 6, 30, .96); color: #fff;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
  padding: 24px; overflow-y: auto;
}
.overlay > * { width: 100%; max-width: 520px; }
.overlay .ico { width: 112px; }
.overlay .field-label { color: #fff; }
.overlay-title { text-align: center; font-size: 2rem; font-weight: 900; margin: 0; }
.heard { font-size: 1.4rem; min-height: 2em; text-align: center; margin: 0; max-width: 600px; }
.overlay .bigbtn { margin-bottom: 0; }
.sheet-to { font-size: 1.2rem; font-weight: 700; text-align: center; margin: 0; direction: ltr; unicode-bidi: plaintext; }
.sheet-body {
  margin: 0; padding: 16px; border-radius: 16px; background: #1a1c24; border: 2px solid #3a3f50;
  font: inherit; font-size: 1.05rem; white-space: pre-wrap; overflow-wrap: anywhere; unicode-bidi: plaintext;
}

/* ---------- Preview banner (artifact preview only) ---------- */
.preview-banner {
  background: var(--focus); color: #000; font-weight: 700; font-size: .9rem;
  padding: 10px 16px; text-align: center;
}
:root.preview .topbar { top: env(safe-area-inset-top, 0px); padding-top: 10px; }

/* ---------- Language button ---------- */
.langbtn { font: inherit; font-size: 1.5rem; font-weight: 900; }

/* ---------- Right-to-left (Arabic) ---------- */
[dir="rtl"] [data-icon="back"] svg { transform: scaleX(-1); }
[dir="rtl"] input[type="tel"] { direction: ltr; text-align: right; }
[dir="rtl"] .sos { letter-spacing: 0; }
[dir="rtl"] body { font-family: system-ui, -apple-system, "Segoe UI", "Noto Sans Arabic", Tahoma, Arial, sans-serif; }

/* ---------- Toast ---------- */
.toast {
  position: fixed; left: 16px; right: 16px; bottom: calc(20px + env(safe-area-inset-bottom));
  max-width: 700px; margin: 0 auto; z-index: 60;
  background: var(--focus); color: #000; font-weight: 800; font-size: 1.2rem;
  padding: 18px 20px; border-radius: 20px; text-align: center;
  box-shadow: 0 10px 30px rgba(0,0,0,.5);
  opacity: 0; transform: translateY(20px); pointer-events: none; transition: .2s;
}
.toast.show { opacity: 1; transform: none; }

/* Small "armed" state for tap-to-hear mode */
.armed { outline: 5px dashed var(--focus) !important; outline-offset: 4px; }

@media (max-width: 380px) {
  .grid { gap: 12px; }
  .tile { min-height: 150px; font-size: 1.1rem; }
  .ico-lg { width: 70px; height: 70px; }
  .pair { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}

.history-item { justify-content: flex-start; text-align: start; }

</style>

      <linearGradient id="g-blue" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8cc8ff"/><stop offset=".5" stop-color="#2f86f6"/><stop offset="1" stop-color="#1446a8"/></linearGradient>
      <linearGradient id="g-green" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9df0a8"/><stop offset=".5" stop-color="#2fc451"/><stop offset="1" stop-color="#14792c"/></linearGradient>

      <linearGradient id="g-yellow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff6a8"/><stop offset=".5" stop-color="#ffd21f"/><stop offset="1" stop-color="#c99100"/></linearGradient>

  </svg>

/* ---------- Translation ---------- */
function T(key, vars = {}) {
  const s = (STRINGS[settings.lang] && STRINGS[settings.lang][key]) ?? STRINGS.en[key] ?? key;
  return s.replace(/\{(\w+)\}/g, (_, k) => (k in vars ? vars[k] : ''));
}
function req(type) {
  const r = REQUESTS[type] || REQUESTS.helper;
  return { icon: r.icon, title: T(type), ...(r[settings.lang] || r.en) };
}
function locale() { return settings.lang === 'ar' ? 'ar-EG' : undefined; }
function speechLang() {
  if (settings.lang === 'ar') return /^ar/i.test(navigator.language || '') ? navigator.language : 'ar-EG';
  return /^ar/i.test(navigator.language || '') ? 'en-US' : (navigator.language || 'en-US');
}

function applyLanguage() {
  const root = document.documentElement;
  root.lang = settings.lang;
  root.dir = settings.lang === 'ar' ? 'rtl' : 'ltr';
  document.querySelectorAll('[data-t]').forEach(el => { el.textContent = T(el.dataset.t); });
  document.querySelectorAll('[data-t-aria]').forEach(el => el.setAttribute('aria-label', T(el.dataset.tAria)));
  document.querySelectorAll('[data-t-ph]').forEach(el => el.setAttribute('placeholder', T(el.dataset.tPh)));
  const langBtn = document.getElementById('langBtn');
  const other = T('langSwitchTo');
  langBtn.textContent = settings.lang === 'ar' ? 'EN' : 'ع';
  langBtn.setAttribute('aria-label', other);
  langBtn.setAttribute('lang', settings.lang === 'ar' ? 'en' : 'ar');

/* ---------- Speech out ---------- */
const synth = window.speechSynthesis;
function pickVoice(lang) {
  if (!synth) return null;
  const voices = synth.getVoices();
  const base = lang.slice(0, 2).toLowerCase();
  return voices.find(v => v.lang.toLowerCase() === lang.toLowerCase())
    || voices.find(v => v.lang.toLowerCase().startsWith(base)) || null;
}
function speak(text, { force = false } = {}) {
  if (!synth || (!settings.voice && !force) || !text) return;
  synth.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.rate = parseFloat(settings.rate) || 0.9;
  u.lang = speechLang();
  const v = pickVoice(u.lang);
  if (v) u.voice = v;
  synth.speak(u);
}

let toastTimer;
function toast(text, { say = true } = {}) {
  const el = document.getElementById('toast');
  el.textContent = text;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 4500);
  if (say) speak(text);
}

/* ---------- Speech in (with typing as a fallback) ---------- */
const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
const overlay = document.getElementById('listening');
const heard = document.getElementById('heard');
const typed = document.getElementById('typedCmd');
let activeRec = null;
let finishListening = null;

function listen() {
  return new Promise(resolve => {
    heard.textContent = '';
    typed.value = '';
    overlay.hidden = false;
    synth && synth.cancel();

    let done = false;
    finishListening = () => {
      if (done) return;
      done = true;
      if (activeRec) { try { activeRec.abort(); } catch { /* already stopped */ } activeRec = null; }
      overlay.hidden = true;
      finishListening = null;
      resolve((typed.value || heard.textContent || '').trim());
    };
    const fallBackToTyping = msgKey => {
      heard.textContent = T(msgKey);
      speak(T(msgKey));
      typed.focus();
    };

    if (!Recognition || PREVIEW) { fallBackToTyping('noVoiceTyping'); return; }

    const rec = new Recognition();
    activeRec = rec;
    rec.lang = speechLang();
    rec.interimResults = true;
    rec.maxAlternatives = 1;
    let finalText = '';
    let failed = false;

    rec.onresult = e => {
      let interim = '';
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const r = e.results[i];
        if (r.isFinal) finalText += r[0].transcript; else interim += r[0].transcript;
      }
      typed.value = (finalText + ' ' + interim).trim();
    };
    rec.onerror = e => {
      failed = true;
      fallBackToTyping(e.error === 'not-allowed' || e.error === 'service-not-allowed' ? 'allowMic' : 'didntHear');
    };
    rec.onend = () => {
      activeRec = null;
      // Heard something: finish straight away. Otherwise leave the box open for typing.
      if (finalText.trim()) finishListening && finishListening();
      else if (!failed) fallBackToTyping('didntHear');
    };
    try { rec.start(); } catch { fallBackToTyping('noVoiceTyping'); }
  });
}
document.getElementById('stopListening').addEventListener('click', () => finishListening && finishListening());
typed.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); finishListening && finishListening(); } });

/* ---------- "Tap once to hear, tap again to choose" ---------- */
let armedEl = null, armedAt = 0;
function labelOf(el) {
  const key = el.dataset.say;
  return (key && T(key)) || el.getAttribute('aria-label') || el.textContent.trim();
}
document.addEventListener('click', e => {
  const el = e.target.closest('button');
  if (!el) return;
  // Keyboard / screen-reader activation (detail === 0) and instant buttons go straight through.
  if (!settings.confirmTap || el.hasAttribute('data-instant') || e.detail === 0) {
    if (navigator.vibrate) navigator.vibrate(15);
    return;
  }
  if (armedEl === el && Date.now() - armedAt < 6000) {
    disarm();
    return; // second tap: let the click through
  }
  e.preventDefault();
  e.stopImmediatePropagation();
  disarm();
  armedEl = el; armedAt = Date.now();
  el.classList.add('armed');
  if (navigator.vibrate) navigator.vibrate(30);
  speak(T('tapAgain', { label: labelOf(el) }), { force: true });
}, true);
function disarm() {
  if (armedEl) armedEl.classList.remove('armed');
  armedEl = null;
}

/* ---------- Routing ---------- */
// The installed app routes with the URL hash so the phone's back button works.
// The preview keeps routes in memory, since the artifact frame owns its URL.
const backBtn = document.getElementById('backBtn');
const titleEl = document.getElementById('screenTitle');
const memStack = [];
let navigatedInApp = false;
let currentRequest = 'helper';
let emergencyTimer = null;
let pendingText = '';

function currentRoute() {
  return PREVIEW ? (memStack[memStack.length - 1] || 'home') : ((location.hash || '#home').slice(1) || 'home');
}
function go(route) {
  if (PREVIEW) { memStack.push(route); render(); return; }
  navigatedInApp = true;
  const hash = '#' + route;
  if (location.hash === hash) render(); else location.hash = hash;
}
backBtn.addEventListener('click', () => {
  if (PREVIEW) { memStack.pop(); render(); return; }
  if (navigatedInApp) window.history.back(); else location.replace('#home');
});
if (!PREVIEW) window.addEventListener('hashchange', render);

document.addEventListener('click', e => {
  const t = e.target.closest('[data-go]');
  if (t) go(t.dataset.go);
});
document.getElementById('skipLink').addEventListener('click', e => {
  e.preventDefault();
  document.getElementById('main').focus();
});

function render() {
  const [screen, arg] = currentRoute().split(':');
  stopEmergency();
  disarm();

  const section = document.getElementById(`screen-${screen}`);
  if (!section) { go('home'); return; }
  document.querySelectorAll('.screen').forEach(s => { s.hidden = s !== section; });

  backBtn.hidden = screen === 'home';
  let title = T(section.dataset.title);

  if (screen === 'home') renderHome();
  if (screen === 'request') title = renderRequest(arg);
  if (screen === 'family') renderFamily();
  if (screen === 'history') renderHistory();
  if (screen === 'settings') renderSettings();
  if (screen === 'emergency') startEmergency();

  titleEl.textContent = title;
  document.title = screen === 'home' ? T('appName') : `${title} · ${T('appName')}`;
  window.scrollTo(0, 0);
  titleEl.focus({ preventScroll: true });

  if (screen === 'request') {
    const cfg = req(currentRequest);
    speak(pendingText
      ? T('wrote', { title, text: pendingText })
      : T('reqIntro', { title, prompt: cfg.prompt }));
    pendingText = '';
  } else if (screen === 'family') speak(T('familyIntro'));
  else if (screen === 'history') speak(T('historyIntro', { n: requests.length }));
  else if (screen === 'settings') speak(T('settingsIntro'));
}

// Keyword matching in English and Arabic (Egyptian and Modern Standard words).
const COMMANDS = [
  ['emergency', /emergenc|\bsos\b|ambulance|police|\bfire\b|i fell|fallen|i('m| am) hurt|help me now|طوارئ|طوارىء|اسعاف|إسعاف|نجدة|النجده|شرطة|بوليس|حريق|وقعت|الحقوني|إلحقوني/],
  ['call', /\b(call|phone|ring)\b|اتصل|إتصل|كلم|كلّم|رن على|رنّ/],
  ['medicine', /medic|pharm|pill|tablet|drug|prescription|drops|دوا|دواء|صيدلي|حبوب|برشام|روشت|قطر/],
  ['ride', /\bride\b|taxi|\bcar\b|drive|take me|go to|lift|uber|careem|مشوار|عربية|تاكسي|اوبر|أوبر|كريم|وصلني|وصّلني|وديني|ودّيني|خدني|توصيلة|اروح|أروح|أذهب/],
  ['history', /my requests|history|طلباتي|السجل/],
  ['groceries', /grocer|food|shop|bread|milk|egg|water|deliver|buy|rice|fruit|vegetable|tea|sugar|بقالة|بقاله|أكل|اكل|طعام|عيش|خبز|لبن|حليب|بيض|مية|مياه|ماء|رز|أرز|فاكه|خضار|شاي|سكر|سوبر ?ماركت|اشتري|أشتري|طلبات|توصيل/],
  ['helper', /help|assist|someone|read|clean|cook|walk|fix|bill|lonely|chat|مساعد|ساعد|حد ي|اقرا|اقرأ|نظاف|تنظيف|طبخ|اطبخ|اتمشى|تمشية|مشي|صلّح|تصليح|فاتور|وحيد|ونس/],
  ['settings', /setting|اعدادات|إعدادات/],
  ['family', /family|عيلة|عائلة|أهلي|اهلي/],
];
function handleCommand(text) {
  const t = text.toLowerCase();
  const match = (COMMANDS.find(([, re]) => re.test(t)) || [])[0];

  switch (match) {
    case 'emergency': return go('emergency');
    case 'call': {
      const fam = familyContacts().find(c => t.includes(c.name.toLowerCase().replace(/\s*\(.*\)$/, '')));
      if (fam) return callNumber(fam.phone, fam.name);
      return go('family');
    }
    case 'medicine': case 'ride': case 'groceries': case 'helper':
      return openRequestWith(match, text);
    case 'history': return go('history');
    case 'settings': return go('settings');
    case 'family': return go('family');
    default:
      speak(T('notSure', { text }));
  }
}

function openRequestWith(type, text) {
  pendingText = text;
  go(`request:${type}`);
}

/* ---------- Request ---------- */
function renderRequest(type) {
  currentRequest = type in REQUESTS ? type : 'helper';
  const cfg = req(currentRequest);
  document.getElementById('reqIcon').innerHTML = iconSVG(cfg.icon);
  document.getElementById('reqPrompt').textContent = cfg.prompt;
  document.getElementById('reqText').value = pendingText;
  document.getElementById('sendHint').textContent = settings.helperPhone
    ? T('sendHintTo', { name: settings.helperName || T('yourHelper'), via: T(settings.sendVia === 'sms' ? 'viaSms' : 'viaWa') })
    : T('needHelperPhone');

  const chips = document.getElementById('quickChips');
  chips.innerHTML = '';
  cfg.chips.forEach(label => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'chip';
    b.textContent = label;
    b.setAttribute('aria-pressed', 'false');
    b.addEventListener('click', () => {
      const on = b.getAttribute('aria-pressed') !== 'true';
      b.setAttribute('aria-pressed', String(on));
      speak(T(on ? 'added' : 'removed', { label }));
    });
    chips.appendChild(b);
  });
  return cfg.title;
}

  const lines = [
    settings.name ? T('msgHello', { name: helperName, me: settings.name }) : T('msgHelloAnon', { name: helperName }),
    `${cfg.intro} ${details}.`,
  ];
  if (settings.address) lines.push(T('msgAddress', { a: settings.address }));
  if (loc) lines.push(T('msgLocation', { l: loc }));
  lines.push(T('msgFooter'));

  addHistory({ type: currentRequest, text: details });
  sendMessage(settings.helperPhone, lines.join('\n'));
});

/* ---------- Messaging and calling ---------- */
function cleanPhone(p) { return String(p || '').replace(/[^\d+]/g, ''); }

const sheet = document.getElementById('sheet');
function showSheet(title, to, body, sayText) {
  document.getElementById('sheetTitle').textContent = title;
  document.getElementById('sheetTo').textContent = to;
  const bodyEl = document.getElementById('sheetBody');
  bodyEl.textContent = body;
  bodyEl.hidden = !body;
  sheet.hidden = false;
  document.getElementById('sheetClose').focus();
  speak(sayText, { force: true });
}
document.getElementById('sheetClose').addEventListener('click', () => { sheet.hidden = true; });
document.getElementById('sheetCopy').addEventListener('click', () => {
  const text = [document.getElementById('sheetTo').textContent, document.getElementById('sheetBody').textContent].filter(Boolean).join('\n\n');
  const fallback = () => {
    const range = document.createRange();
    range.selectNodeContents(document.getElementById('sheetBody'));
    const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(range);
  };
  try {
    navigator.clipboard.writeText(text).then(() => toast(T('copied')), fallback);
  } catch { fallback(); }
});

function sendMessage(phone, body) {
  const num = cleanPhone(phone);
  const via = T(settings.sendVia === 'sms' ? 'viaSms' : 'viaWa');
  if (PREVIEW) {
    const name = settings.helperName || T('yourHelper');
    showSheet(T('previewMsgTitle'), T('to', { name, num }), body, T('previewMsgSay', { via, name }));
    return;
  }
  const url = settings.sendVia === 'sms'
    ? `sms:${num}?&body=${encodeURIComponent(body)}`
    : `https://wa.me/${num.replace(/^\+/, '')}?text=${encodeURIComponent(body)}`;
  toast(T('opening'));
  setTimeout(() => { location.href = url; }, 1800);
}

function callNumber(phone, name) {
  const num = cleanPhone(phone);
  if (PREVIEW) {
    showSheet(T('previewCallTitle'), T('to', { name: name || '', num }), '', T('previewCallSay', { num: num.split('').join(' ') }));
    return;
  }
  if (name) speak(T('calling', { name }));
  setTimeout(() => { location.href = `tel:${num}`; }, name ? 1000 : 0);
}

function getLocationLink() {
  return new Promise(resolve => {
    if (PREVIEW || !navigator.geolocation) return resolve('');
    navigator.geolocation.getCurrentPosition(
      p => resolve(`https://maps.google.com/?q=${p.coords.latitude.toFixed(5)},${p.coords.longitude.toFixed(5)}`),
      () => resolve(''),
      { enableHighAccuracy: true, timeout: 8000, maximumAge: 60000 },
    );
  });
}

/* ---------- History ---------- */
function addHistory(item) {
  requests.unshift({ ...item, at: Date.now() });
  requests = requests.slice(0, 50);
  store.set('hh.history', requests);
}
function renderHistory() {
  const list = document.getElementById('historyList');
  list.innerHTML = '';
  if (!requests.length) {
    const p = document.createElement('p');
    p.className = 'empty';
    p.textContent = T('noRequests');
    list.appendChild(p);
    return;
  }
  requests.forEach(h => {
    const cfg = req(h.type);
    const when = new Date(h.at).toLocaleString(locale(), { weekday: 'long', hour: 'numeric', minute: '2-digit', day: 'numeric', month: 'short' });
    const btn = document.createElement('button');
    btn.className = 'bigbtn bigbtn-gray history-item';
    btn.dataset.instant = '';
    btn.innerHTML = `<span class="ico">${iconSVG(cfg.icon)}</span><span><strong></strong><br><small></small></span>`;
    btn.querySelector('strong').textContent = `${cfg.title}: ${h.text}`;
    btn.querySelector('small').textContent = when;
    btn.addEventListener('click', () => speak(T('sentAt', { title: cfg.title, text: h.text, when }), { force: true }));
    list.appendChild(btn);
  });
}
document.getElementById('clearHistory').addEventListener('click', () => {
  requests = [];
  store.set('hh.history', requests);
  renderHistory();
  toast(T('listEmpty'));
});

/* ---------- Family ---------- */
function familyContacts() {
  const out = [];
  for (const i of [1, 2, 3]) {
    const name = String(settings[`fam${i}Name`] || '').trim(), phone = String(settings[`fam${i}Phone`] || '').trim();
    if (phone) out.push({ name: name || T('familyN', { n: i }), phone });
  }
  if (settings.helperPhone) out.push({ name: settings.helperName || T('myHelperName'), phone: settings.helperPhone });
  return out;
}
function renderFamily() {
  const list = document.getElementById('familyList');
  list.innerHTML = '';
  const people = familyContacts();
  if (!people.length) {
    const p = document.createElement('p');
    p.className = 'empty';
    p.textContent = T('noFamily');
    const b = document.createElement('button');
    b.className = 'bigbtn bigbtn-blue';
    b.dataset.go = 'settings';
    b.dataset.say = 'addFamily';
    b.innerHTML = `<span class="ico">${iconSVG('gear')}</span><span></span>`;
    b.lastChild.textContent = T('addFamily');
    list.append(p, b);
    return;
  }
  people.forEach(p => {
    const label = T('callX', { name: p.name });
    const b = document.createElement('button');
    b.className = 'bigbtn bigbtn-green';
    b.dataset.say = label;
    b.innerHTML = `<span class="ico">${iconSVG('person')}</span><span></span>`;
    b.lastChild.textContent = label;
    b.addEventListener('click', () => callNumber(p.phone, p.name));
    list.appendChild(b);
  });
}

/* ---------- Emergency ---------- */
function startEmergency() {
  const text = document.getElementById('countdownText');
  const num = cleanPhone(settings.emergency);
  if (!num) {
    text.textContent = T('noEmergencyText');
    speak(T('noEmergencySay'));
    return;
  }
  const spokenNum = num.split('').join(' ');
  const total = parseInt(settings.countdown, 10) || 0;
  if (!total || PREVIEW) {
    text.textContent = T('tapCallNowText', { num });
    speak(T('tapCallNowSay', { num: spokenNum }));
    return;
  }
  let left = total;
  const tick = () => {
    if (left <= 0) {
      stopEmergency();
      text.textContent = T('callingNum', { num });
      callNumber(num);
      return;
    }
    text.textContent = T('callingInText', { num, n: left.toLocaleString(locale()) });
    speak(left === total ? T('callingInSay', { n: left }) : left.toLocaleString(locale()), { force: true });
    left -= 1;
  };
  tick();
  emergencyTimer = setInterval(tick, 1000);
}
function stopEmergency() {
  if (emergencyTimer) { clearInterval(emergencyTimer); emergencyTimer = null; }
}
document.getElementById('callEmergencyNow').addEventListener('click', () => {
  stopEmergency();
  const num = cleanPhone(settings.emergency);
  if (!num) { toast(T('addEmergencyNum')); return; }
  callNumber(num);
});
document.getElementById('cancelEmergency').addEventListener('click', () => {
  stopEmergency();
  speak(T('cancelled'), { force: true });
  go('home');
});
document.getElementById('alertHelperBtn').addEventListener('click', async () => {
  stopEmergency();
  if (!settings.helperPhone) { toast(T('needHelperPhone')); return; }
  speak(T('findingLoc'), { force: true });
  const loc = await getLocationLink();
  const lines = [settings.name ? T('emergencyMsg', { name: settings.name }) : T('emergencyMsgAnon')];
  if (settings.address) lines.push(T('msgAddress', { a: settings.address }));
  if (loc) lines.push(T('msgLocation', { l: loc }));
  addHistory({ type: 'helper', text: T('emergencyAlert') });
  sendMessage(settings.helperPhone, lines.join('\n'));
});

/* ---------- Settings ---------- */
const form = document.getElementById('settingsForm');
function renderSettings() {
  for (const [k, v] of Object.entries(settings)) {
    const el = form.elements[k];
    if (!el) continue;
    if (el.type === 'checkbox') el.checked = !!v; else el.value = v;
  }
}
function saveSettings(next) {
  settings = next;
  store.set('hh.settings', settings);
  applyLook();
  applyLanguage();
}
form.addEventListener('submit', e => {
  e.preventDefault();
  const next = { ...settings };
  for (const k of Object.keys(DEFAULTS)) {
    const el = form.elements[k];
    if (!el) continue;
    next[k] = el.type === 'checkbox' ? el.checked : el.value.trim();
  }
  saveSettings(next);
  toast(T('saved'), { say: false });
  speak(T('settingsSaved'), { force: true });
  go('home');
});

// One-tap language switch in the top bar.
document.getElementById('langBtn').addEventListener('click', () => {
  saveSettings({ ...settings, lang: settings.lang === 'ar' ? 'en' : 'ar' });
  render();
  speak(`${T('appName')}. ${T('welcomeTail')}`, { force: true });
});

/* ---------- Start ---------- */
if (PREVIEW) {
  document.documentElement.classList.add('preview');
  document.getElementById('previewBanner').hidden = false;
}
paintIcons();
applyLook();
applyLanguage();
render();
if (synth) synth.getVoices(); // starts loading voices early on Chrome

if (!PREVIEW && 'serviceWorker' in navigator && location.protocol !== 'file:') {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}

</script>
