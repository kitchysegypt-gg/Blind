<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Easy Help</title>
  <meta name="description" content="Easy Help for elders: groceries, pharmacy, rides, help at home, medicine reminders, family calls and location in one simple app.">
  <meta name="theme-color" content="#2e5e4a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Easy Help">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/logo.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Cairo:wght@500;600;700;800&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<!-- BODY:START -->
  <a class="skip" href="#main" id="skipLink" data-t="skip">Skip to main content</a>
  <div id="previewBanner" class="preview-banner" hidden data-t="previewBanner"></div>

  <header class="topbar" id="topbar">
    <button id="backBtn" class="iconbtn" hidden data-t-aria="back" aria-label="Back">
      <span class="ico" data-icon="back"></span>
    </button>
    <span class="brandmark" id="brandmark" aria-hidden="true"><span class="ico" data-icon="homeheart"></span></span>
    <h1 id="screenTitle" tabindex="-1">Easy Help</h1>
    <button id="langBtn" class="langbtn" aria-label="العربية" lang="ar">ع</button>
  </header>

  <main id="main" tabindex="-1">
    <!-- SIGN IN -->
    <section id="screen-signin" class="screen" hidden data-title="appName">
      <div class="welcome">
        <img class="welcome-logo" src="icons/logo.jpg" alt="Easy Help for Elders. A little help, a lot of care." width="220" height="220">
        <p class="welcome-sub" data-t="signinIntro"></p>
      </div>

      <div class="card pad">
        <form id="authForm" class="stack" novalidate>
          <div id="nameRow" hidden>
            <label class="field-label" for="authName" data-t="myName"></label>
            <input class="field" id="authName" autocomplete="name">
          </div>
          <div>
            <label class="field-label" for="authEmail" data-t="email"></label>
            <input class="field" id="authEmail" type="email" inputmode="email" autocomplete="email" autocapitalize="off" spellcheck="false">
          </div>
          <div>
            <label class="field-label" for="authPassword" data-t="password"></label>
            <input class="field" id="authPassword" type="password" autocomplete="current-password">
          </div>
          <p id="authMsg" class="msg" role="alert"></p>
          <button type="submit" class="btn btn-primary" id="authSubmit"><span id="authSubmitLabel"></span></button>
          <button type="button" class="btn btn-secondary" id="authToggle"><span id="authToggleLabel"></span></button>
          <button type="button" class="linkbtn" id="authForgot" data-t="forgot"></button>
        </form>

        <div id="previewAuth" class="stack" hidden>
          <button type="button" class="btn btn-primary" id="continueAs"><span id="continueAsLabel"></span></button>
        </div>
      </div>

      <button type="button" class="linkbtn center" id="skipSignIn" data-t="noAccount"></button>
    </section>

    <!-- HOME -->
    <section id="screen-home" class="screen" hidden data-title="appName">
      <div class="hero">
        <p class="hero-hello" id="todayHello"></p>
        <p class="hero-time" id="todayTime"></p>
        <p class="hero-date" id="todayDate"></p>
      </div>

      <div id="homeNotices" class="stack"></div>

      <button class="sos" data-go="emergency">
        <span class="sos-ico"><span class="ico" data-icon="alert"></span></span>
        <span class="sos-text"><span class="sos-title" data-t="emergency"></span><span class="sos-sub" data-t="emergencySub"></span></span>
        <span class="chev" data-icon="chev"></span>
      </button>

      <button class="card row-card" id="imOkBtn" type="button">
        <span class="row-ico" data-tone="green"><span class="ico" data-icon="smile"></span></span>
        <span class="row-text"><span class="row-title" data-t="imOk"></span><span class="row-sub" data-t="imOkSub"></span></span>
        <span class="chev" data-icon="chev"></span>
      </button>

      <h2 class="section-title" data-t="needSomething"></h2>
      <div class="tiles">
        <button class="tile" data-go="service:groceries" data-tone="green">
          <span class="tile-ico"><span class="ico" data-icon="bag"></span></span>
          <span class="tile-title" data-t="groceries"></span>
          <span class="tile-sub" data-t="groceriesSub"></span>
        </button>
        <button class="tile" data-go="service:medicine" data-tone="blue">
          <span class="tile-ico"><span class="ico" data-icon="pill"></span></span>
          <span class="tile-title" data-t="medicine"></span>
          <span class="tile-sub" data-t="medicineSub"></span>
        </button>
        <button class="tile" data-go="service:ride" data-tone="amber">
          <span class="tile-ico"><span class="ico" data-icon="car"></span></span>
          <span class="tile-title" data-t="ride"></span>
          <span class="tile-sub" data-t="rideSub"></span>
        </button>
        <button class="tile" data-go="service:helper" data-tone="purple">
          <span class="tile-ico"><span class="ico" data-icon="hands"></span></span>
          <span class="tile-title" data-t="helper"></span>
          <span class="tile-sub" data-t="helperSub"></span>
        </button>
        <button class="tile" data-go="service:pro" data-tone="teal">
          <span class="tile-ico"><span class="ico" data-icon="steth"></span></span>
          <span class="tile-title" data-t="pro"></span>
          <span class="tile-sub" data-t="proSub"></span>
        </button>
        <button class="tile" data-go="service:errands" data-tone="slate">
          <span class="tile-ico"><span class="ico" data-icon="doc"></span></span>
          <span class="tile-title" data-t="errands"></span>
          <span class="tile-sub" data-t="errandsSub"></span>
        </button>
      </div>

      <div class="section-head">
        <h2 class="section-title" data-t="nextMedTitle"></h2>
        <button class="textbtn" data-go="meds" data-t="seeAll"></button>
      </div>
      <button class="card row-card" data-go="meds" id="homeMed">
        <span class="row-ico" data-tone="blue"><span class="ico" data-icon="clock"></span></span>
        <span class="row-text"><span class="row-title" id="homeMedTitle"></span><span class="row-sub" id="homeMedSub"></span></span>
        <span class="chev" data-icon="chev"></span>
      </button>

      <div class="section-head">
        <h2 class="section-title" data-t="familyTitle"></h2>
        <button class="textbtn" data-go="profile" data-t="edit"></button>
      </div>
      <div id="familyList" class="card list-card"></div>
    </section>

    <!-- ONE SERVICE: groceries, pharmacy, ride or help at home -->
    <section id="screen-service" class="screen" hidden data-title="appName">
      <div class="service-head" id="serviceHead">
        <span class="service-ico"><span class="ico" id="serviceIcon"></span></span>
        <div>
          <p class="service-title" id="serviceTitle"></p>
          <p class="service-lead" id="serviceLead"></p>
        </div>
      </div>
      <p class="card pad plan-note" id="servicePlanNote" hidden></p>

      <div class="card pad stack">
        <p class="field-label" id="servicePrompt"></p>
        <div id="quickChips" class="chips"></div>
        <div>
          <label class="field-label" for="reqText" data-t="otherLabel"></label>
          <textarea class="field" id="reqText" rows="3"></textarea>
        </div>
      </div>

      <div class="card pad stack">
        <p class="field-label" data-t="whenLabel"></p>
        <div class="segmented" role="radiogroup" id="whenGroup">
          <label><input type="radio" name="when" value="now" checked><span data-t="whenNow"></span></label>
          <label><input type="radio" name="when" value="today"><span data-t="whenToday"></span></label>
          <label><input type="radio" name="when" value="tomorrow"><span data-t="whenTomorrow"></span></label>
        </div>
        <label class="toggle">
          <input type="checkbox" id="shareLoc" checked>
          <span class="toggle-track" aria-hidden="true"></span>
          <span id="shareLocLabel"></span>
        </label>
      </div>

      <button class="btn btn-primary btn-lg" id="sendReqBtn">
        <span class="ico" data-icon="send"></span><span id="sendReqLabel"></span>
      </button>
      <p class="hint center" id="sendHint"></p>
    </section>

    <!-- REQUESTS -->
    <section id="screen-requests" class="screen" hidden data-title="tabRequests">
      <p class="lead" data-t="requestsLead"></p>
      <div id="historyList" class="stack"></div>
      <button class="btn btn-secondary" id="clearHistory"><span class="ico" data-icon="trash"></span><span data-t="clearList"></span></button>
    </section>

    <!-- MEDICINES -->
    <section id="screen-meds" class="screen" hidden data-title="tabMeds">
      <p class="lead" data-t="medsLead"></p>
      <div id="medList" class="stack"></div>
      <button class="btn btn-primary" data-go="medadd"><span class="ico" data-icon="plus"></span><span data-t="addMed"></span></button>
      <p class="hint" data-t="medsHint"></p>
    </section>

    <section id="screen-medadd" class="screen" hidden data-title="addMed">
      <div class="card pad stack">
        <div>
          <label class="field-label" for="medName" data-t="medName"></label>
          <input class="field" id="medName" autocomplete="off" data-t-ph="medNamePh">
        </div>
        <div>
          <p class="field-label" data-t="medTimes"></p>
          <div id="medTimes" class="stack"></div>
        </div>
        <button type="button" class="btn btn-secondary" id="addTimeBtn"><span class="ico" data-icon="plus"></span><span data-t="addTime"></span></button>
      </div>
      <button class="btn btn-primary btn-lg" id="saveMedBtn"><span class="ico" data-icon="check"></span><span data-t="saveMed"></span></button>
    </section>

    <!-- LOCATION -->
    <section id="screen-location" class="screen" hidden data-title="tabLocation">
      <div class="card map-card">
        <div class="map" id="map" role="img" data-t-aria="mapAlt">
          <div class="map-tiles" id="mapTiles"></div>
          <span class="map-pin" aria-hidden="true"><span class="ico" data-icon="pin"></span></span>
          <span class="map-credit">© OpenStreetMap</span>
        </div>
        <div class="pad">
          <p class="card-label" data-t="youAreAt"></p>
          <p class="place-address" id="placeAddress" aria-live="polite"></p>
          <p class="hint" id="placeNote"></p>
        </div>
      </div>

      <button class="btn btn-primary btn-lg" id="sendPlace"><span class="ico" data-icon="send"></span><span id="sendPlaceLabel"></span></button>
      <div class="btn-grid">
        <a class="btn btn-secondary" id="openMaps" href="#" target="_blank" rel="noopener"><span class="ico" data-icon="map"></span><span data-t="openMaps"></span></a>
        <button class="btn btn-secondary" id="refreshPlace"><span class="ico" data-icon="refresh"></span><span data-t="refresh"></span></button>
      </div>

      <div class="card pad stack">
        <p class="card-label" data-t="homeAddress"></p>
        <p class="lead" id="homeAddressText"></p>
        <p class="hint" id="homeDistance"></p>
        <div class="btn-grid">
          <a class="btn btn-secondary" id="directionsHome" href="#" target="_blank" rel="noopener"><span class="ico" data-icon="home"></span><span data-t="directionsHome"></span></a>
          <button class="btn btn-secondary" id="savePlace"><span class="ico" data-icon="check"></span><span data-t="saveHome"></span></button>
        </div>
      </div>
    </section>

    <!-- PROFILE -->
    <section id="screen-profile" class="screen" hidden data-title="tabProfile">
      <div class="card pad profile-head">
        <span class="avatar" id="avatar"></span>
        <div class="profile-who">
          <p class="row-title" id="profileName"></p>
          <p class="row-sub" id="accountLine"></p>
        </div>
      </div>
      <div class="btn-grid">
        <button type="button" class="btn btn-secondary" id="accountBtn"><span class="ico" data-icon="logout"></span><span id="accountBtnLabel"></span></button>
      </div>
      <div id="passwordChange" class="card pad stack" hidden>
        <label class="field-label" for="newPassword" data-t="newPassword"></label>
        <input class="field" id="newPassword" type="password" autocomplete="new-password">
        <button type="button" class="btn btn-secondary" id="savePassword"><span data-t="changePassword"></span></button>
      </div>

      <form id="settingsForm" class="stack" novalidate>
        <fieldset class="card pad stack">
          <legend class="card-label" data-t="myPlan"></legend>
          <div>
            <label class="field-label" for="s-plan" data-t="planLabel"></label>
            <select class="field" id="s-plan" name="plan">
              <option value="free" data-t="plan_free"></option>
              <option value="m1" data-t="plan_m1"></option>
              <option value="m3" data-t="plan_m3"></option>
              <option value="m6" data-t="plan_m6"></option>
              <option value="y1" data-t="plan_y1"></option>
              <option value="life" data-t="plan_life"></option>
            </select>
          </div>
          <ul class="plan-list">
            <li data-t="planFree"></li>
            <li data-t="tier_m1"></li>
            <li data-t="tier_m3"></li>
            <li data-t="tier_m6"></li>
            <li data-t="tier_y1"></li>
            <li data-t="tier_life"></li>
          </ul>
          <p class="hint" data-t="planPayHint"></p>
        </fieldset>

        <fieldset class="card pad stack">
          <legend class="card-label" data-t="aboutMe"></legend>
          <div><label class="field-label" for="s-name" data-t="myName"></label><input class="field" id="s-name" name="name" autocomplete="name"></div>
          <div><label class="field-label" for="s-address" data-t="myAddress"></label><textarea class="field" id="s-address" name="address" rows="2" autocomplete="street-address"></textarea></div>
        </fieldset>

        <fieldset class="card pad stack">
          <legend class="card-label" data-t="myHelper"></legend>
          <p class="hint" data-t="helperHint"></p>
          <div><label class="field-label" for="s-helperName" data-t="helperName"></label><input class="field" id="s-helperName" name="helperName"></div>
          <div><label class="field-label" for="s-helperPhone" data-t="helperPhone"></label><input class="field" id="s-helperPhone" name="helperPhone" type="tel" inputmode="tel" dir="ltr"></div>
          <div>
            <label class="field-label" for="s-sendVia" data-t="sendVia"></label>
            <select class="field" id="s-sendVia" name="sendVia">
              <option value="whatsapp" data-t="whatsapp"></option>
              <option value="sms" data-t="sms"></option>
            </select>
          </div>
        </fieldset>

        <fieldset class="card pad stack">
          <legend class="card-label" data-t="familyTitle"></legend>
          <div class="pair"><div><label class="field-label" for="s-fam1Name" data-t="fam1"></label><input class="field" id="s-fam1Name" name="fam1Name" data-t-ph="famName"></div><div><label class="field-label" for="s-fam1Phone" data-t="famPhone"></label><input class="field" id="s-fam1Phone" name="fam1Phone" type="tel" inputmode="tel" dir="ltr"></div></div>
          <div class="pair"><div><label class="field-label" for="s-fam2Name" data-t="fam2"></label><input class="field" id="s-fam2Name" name="fam2Name" data-t-ph="famName"></div><div><label class="field-label" for="s-fam2Phone" data-t="famPhone"></label><input class="field" id="s-fam2Phone" name="fam2Phone" type="tel" inputmode="tel" dir="ltr"></div></div>
          <div class="pair"><div><label class="field-label" for="s-fam3Name" data-t="fam3"></label><input class="field" id="s-fam3Name" name="fam3Name" data-t-ph="famName"></div><div><label class="field-label" for="s-fam3Phone" data-t="famPhone"></label><input class="field" id="s-fam3Phone" name="fam3Phone" type="tel" inputmode="tel" dir="ltr"></div></div>
        </fieldset>

        <fieldset class="card pad stack">
          <legend class="card-label" data-t="emergency"></legend>
          <div><label class="field-label" for="s-emergency" data-t="emergencyNumber"></label><input class="field" id="s-emergency" name="emergency" type="tel" inputmode="tel" dir="ltr" data-t-ph="emergencyPh"></div>
          <div>
            <label class="field-label" for="s-countdown" data-t="countdownLabel"></label>
            <select class="field" id="s-countdown" name="countdown">
              <option value="0" data-t="noAuto"></option>
              <option value="5" data-t="sec5"></option>
              <option value="10" data-t="sec10"></option>
            </select>
          </div>
        </fieldset>

        <fieldset class="card pad stack">
          <legend class="card-label" data-t="display"></legend>
          <div>
            <label class="field-label" for="s-lang" data-t="language"></label>
            <select class="field" id="s-lang" name="lang">
              <option value="en">English</option>
              <option value="ar" lang="ar">العربية</option>
            </select>
          </div>
          <div>
            <label class="field-label" for="s-size" data-t="size"></label>
            <select class="field" id="s-size" name="size">
              <option value="1" data-t="normal"></option>
              <option value="1.15" data-t="large"></option>
              <option value="1.3" data-t="xl"></option>
            </select>
          </div>
        </fieldset>

        <button type="submit" class="btn btn-primary btn-lg"><span class="ico" data-icon="check"></span><span data-t="save"></span></button>
      </form>

      <div class="card pad stack share-card">
        <p class="card-label" data-t="shareApp"></p>
        <div class="qr-box"><svg role="img" aria-labelledby="qrTitle" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 37 37" class="qr"><title id="qrTitle" data-t="qrAlt">QR code that opens Easy Help</title><path fill="#fff" d="M0 0h37v37h-37z"/><path stroke="#1d2b24" d="M2 2.5h7m3 0h1m1 0h10m1 0h1m2 0h7m-33 1h1m5 0h1m2 0h9m3 0h2m1 0h1m1 0h1m5 0h1m-33 1h1m1 0h3m1 0h1m1 0h2m3 0h1m3 0h2m1 0h2m4 0h1m1 0h3m1 0h1m-33 1h1m1 0h3m1 0h1m1 0h1m1 0h1m3 0h1m1 0h1m3 0h1m1 0h1m1 0h1m1 0h1m1 0h3m1 0h1m-33 1h1m1 0h3m1 0h1m1 0h1m2 0h2m2 0h1m1 0h2m2 0h2m3 0h1m1 0h3m1 0h1m-33 1h1m5 0h1m1 0h1m1 0h2m1 0h4m1 0h1m1 0h3m3 0h1m5 0h1m-33 1h7m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h7m-25 1h1m2 0h1m2 0h2m5 0h3m-24 1h1m1 0h5m2 0h3m1 0h1m1 0h1m1 0h1m2 0h1m3 0h1m1 0h5m-31 1h3m8 0h1m2 0h3m1 0h4m1 0h1m2 0h2m1 0h3m-26 1h1m1 0h1m1 0h2m3 0h2m1 0h1m9 0h1m1 0h2m-32 1h2m1 0h1m1 0h1m1 0h1m6 0h1m4 0h1m1 0h2m5 0h4m-32 1h3m2 0h6m7 0h1m2 0h2m1 0h2m2 0h2m2 0h1m-33 1h2m2 0h1m2 0h2m3 0h5m3 0h1m5 0h1m3 0h3m-33 1h1m1 0h1m2 0h3m1 0h1m1 0h1m2 0h1m2 0h1m1 0h1m2 0h1m1 0h3m4 0h1m-32 1h6m2 0h1m2 0h1m4 0h1m1 0h4m2 0h7m-31 1h2m4 0h3m1 0h5m2 0h1m1 0h2m1 0h2m1 0h1m1 0h2m1 0h1m1 0h1m-33 1h2m1 0h2m3 0h1m1 0h2m2 0h7m2 0h1m2 0h2m1 0h3m-30 1h1m1 0h1m1 0h1m6 0h5m2 0h1m1 0h1m2 0h4m1 0h2m-32 1h1m1 0h3m5 0h1m1 0h1m1 0h1m1 0h3m2 0h1m2 0h2m1 0h6m-31 1h1m1 0h5m2 0h4m1 0h1m4 0h2m1 0h2m2 0h2m-30 1h2m3 0h1m3 0h1m3 0h3m2 0h1m2 0h2m2 0h3m4 0h1m-33 1h1m2 0h1m2 0h1m2 0h1m5 0h2m1 0h1m2 0h1m6 0h2m1 0h1m-32 1h1m1 0h1m4 0h1m2 0h1m1 0h1m1 0h2m5 0h2m2 0h2m2 0h3m-32 1h1m1 0h1m1 0h3m1 0h1m2 0h2m2 0h1m1 0h1m4 0h1m1 0h5m1 0h1m-23 1h4m1 0h2m3 0h4m2 0h1m3 0h1m1 0h3m-33 1h7m2 0h2m1 0h1m2 0h1m2 0h1m1 0h1m1 0h3m1 0h1m1 0h1m1 0h1m-31 1h1m5 0h1m1 0h2m3 0h1m1 0h2m2 0h3m1 0h2m3 0h3m1 0h1m-33 1h1m1 0h3m1 0h1m1 0h1m3 0h1m2 0h1m2 0h2m2 0h1m1 0h6m1 0h1m-32 1h1m1 0h3m1 0h1m1 0h1m3 0h2m1 0h2m7 0h2m2 0h5m-33 1h1m1 0h3m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m2 0h2m1 0h2m1 0h1m2 0h2m1 0h1m-30 1h1m5 0h1m4 0h2m3 0h1m3 0h3m1 0h1m1 0h1m1 0h3m-31 1h7m1 0h2m2 0h2m2 0h2m1 0h1m3 0h3m1 0h1m3 0h1"/></svg>
</div>
        <p class="hint center" data-t="shareAppSub"></p>
      </div>
    </section>

    <!-- EMERGENCY -->
    <section id="screen-emergency" class="screen screen-sos" hidden data-title="emergency">
      <div class="sos-panel">
        <span class="sos-ring"><span class="ico" data-icon="alert"></span></span>
        <p class="sos-count" id="countdownNum" aria-hidden="true"></p>
        <p class="sos-msg" id="countdownText" role="status"></p>
      </div>
      <button class="btn btn-danger btn-lg" id="callEmergencyNow"><span class="ico" data-icon="phone"></span><span data-t="callNow"></span></button>
      <button class="btn btn-light btn-lg" id="alertHelperBtn"><span class="ico" data-icon="send"></span><span id="alertHelperLabel"></span></button>
      <button class="btn btn-ghost-light btn-lg" id="cancelEmergency"><span data-t="cancel"></span></button>
    </section>
  </main>

  <nav class="tabbar" id="tabbar" data-t-aria="tabsLabel">
    <button class="tab" data-tab="home"><span class="ico" data-icon="home"></span><span data-t="tabHome"></span></button>
    <button class="tab" data-tab="requests"><span class="ico" data-icon="list"></span><span data-t="tabRequests"></span></button>
    <button class="tab" data-tab="meds"><span class="ico" data-icon="pill"></span><span data-t="tabMeds"></span></button>
    <button class="tab" data-tab="location"><span class="ico" data-icon="pin"></span><span data-t="tabLocation"></span></button>
    <button class="tab" data-tab="profile"><span class="ico" data-icon="user"></span><span data-t="tabProfile"></span></button>
  </nav>

  <!-- Medicine reminder -->
  <div id="reminder" class="overlay" hidden role="alertdialog" aria-modal="true" aria-labelledby="reminderTitle">
    <div class="dialog">
      <span class="dialog-ico"><span class="ico" data-icon="pill"></span></span>
      <p class="dialog-title" id="reminderTitle" data-t="remindTitle"></p>
      <p class="dialog-what" id="reminderWhat"></p>
      <button class="btn btn-primary btn-lg" id="tookItBtn"><span class="ico" data-icon="check"></span><span data-t="tookIt"></span></button>
      <button class="btn btn-secondary" id="snoozeBtn"><span class="ico" data-icon="clock"></span><span data-t="later10"></span></button>
      <button class="linkbtn center" id="skipDoseBtn" data-t="skipDose"></button>
    </div>
  </div>

  <!-- Preview only: what would be sent or called -->
  <div id="sheet" class="overlay" hidden role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="dialog">
      <p class="dialog-title" id="sheetTitle"></p>
      <p class="hint" id="sheetTo" dir="auto"></p>
      <pre class="sheet-body" id="sheetBody" dir="auto"></pre>
      <p class="hint" id="sheetNote"></p>
      <button class="btn btn-secondary" id="sheetCopy"><span data-t="copy"></span></button>
      <button class="btn btn-primary" id="sheetClose"><span data-t="close"></span></button>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
<!-- BODY:END -->
  <script src="app.js"></script>
</body>
</html>
